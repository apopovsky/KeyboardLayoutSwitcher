name: .NET Desktop

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_PATH: KeyboardLayoutSwitcher.csproj
  CONFIGURATION: Release
  RUNTIME: win-x64

jobs:
  build:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore $env:PROJECT_PATH

      - name: Build
        run: dotnet build $env:PROJECT_PATH --configuration $env:CONFIGURATION --no-restore

      - name: Publish self-contained executable
        run: >-
          dotnet publish $env:PROJECT_PATH
          --configuration $env:CONFIGURATION
          --runtime $env:RUNTIME
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardLayoutSwitcher-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach executable to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download published artifact
        uses: actions/download-artifact@v4
        with:
          name: KeyboardLayoutSwitcher-win-x64
          path: artifact

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" artifact/KeyboardLayoutSwitcher.exe --clobber
